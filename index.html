<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>СЛОВОДЕЛ — словесная игра на русском</title>

<meta name="description" content="СЛОВОДЕЛ — словесная игра на русском языке. Угадай слово из 5 букв за 6 попыток.">
<meta name="theme-color" content="#1e1140">

<style>
    @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800;900&family=Manrope:wght@500;600;700;800&display=swap');

    :root {
        /* --- СВЕТЛАЯ ТЕМА (Aurora Glass · Light) --- */
        --bg-1: #ffd9ec;
        --bg-2: #cdeeff;
        --bg-3: #fff2c9;
        --bg-color: #f3edff;
        --text-main: #241a3d;
        --text-dim: rgba(36, 26, 61, 0.62);

        --glass-bg: rgba(255, 255, 255, 0.5);
        --glass-bg-strong: rgba(255, 255, 255, 0.68);
        --glass-border: rgba(255, 255, 255, 0.85);
        --glass-shadow: 0 10px 40px rgba(96, 60, 160, 0.18);

        --accent: #8b5cf6;
        --accent-2: #06b6d4;

        --modal-bg: rgba(255, 255, 255, 0.72);
        --modal-overlay: rgba(60, 40, 90, 0.28);

        --tile-absent: rgba(36, 26, 61, 0.14);
        --tile-absent-border: rgba(36, 26, 61, 0.16);
        --tile-correct-a: #3fd48b;
        --tile-correct-b: #0ea56f;
        --tile-present-a: #ffc24b;
        --tile-present-b: #e08e00;

        --key-bg: rgba(255, 255, 255, 0.55);
        --key-text: #241a3d;

        --tile-border: rgba(36, 26, 61, 0.18);
        --tile-filled-border: var(--accent);
        --tile-text-filled: #241a3d;

        --header-border: rgba(255, 255, 255, 0.6);
        --header-height: 56px;
        --btn-hover: rgba(139, 92, 246, 0.14);
    }

    /* --- ТЁМНАЯ ТЕМА (Aurora Glass · Dark) --- */
    body.dark-mode {
        --bg-1: #22124a;
        --bg-2: #0c2246;
        --bg-3: #3a0f34;
        --bg-color: #0b0817;
        --text-main: #f5f1ff;
        --text-dim: rgba(245, 241, 255, 0.6);

        --glass-bg: rgba(255, 255, 255, 0.055);
        --glass-bg-strong: rgba(255, 255, 255, 0.09);
        --glass-border: rgba(255, 255, 255, 0.14);
        --glass-shadow: 0 10px 45px rgba(0, 0, 0, 0.55);

        --accent: #b18bff;
        --accent-2: #33e5ff;

        --modal-bg: rgba(20, 14, 36, 0.6);
        --modal-overlay: rgba(4, 2, 12, 0.62);

        --tile-absent: rgba(255, 255, 255, 0.055);
        --tile-absent-border: rgba(255, 255, 255, 0.1);
        --tile-correct-a: #35e6a0;
        --tile-correct-b: #0a9463;
        --tile-present-a: #ffcf5c;
        --tile-present-b: #d9930a;

        --key-bg: rgba(255, 255, 255, 0.08);
        --key-text: #f5f1ff;

        --tile-border: rgba(255, 255, 255, 0.16);
        --tile-filled-border: var(--accent);
        --tile-text-filled: #ffffff;

        --header-border: rgba(255, 255, 255, 0.12);
        --btn-hover: rgba(177, 139, 255, 0.16);
    }

    * { box-sizing: border-box; }

    body {
        background-color: var(--bg-color);
        color: var(--text-main);
        margin: 0;
        font-family: 'Manrope', sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        height: 100dvh;
        width: 100%;
        overflow: hidden;
        touch-action: manipulation;
        transition: background-color 0.5s, color 0.4s;
        position: relative;
        -webkit-tap-highlight-color: transparent;
    }

    /* --- АВРОРА-ФОН --- */
    .aurora {
        position: fixed;
        inset: 0;
        z-index: -2;
        overflow: hidden;
        pointer-events: none;
    }
    .aurora span {
        position: absolute;
        border-radius: 50%;
        filter: blur(70px);
        opacity: 0.55;
        will-change: transform;
    }
    body.dark-mode .aurora span { opacity: 0.42; mix-blend-mode: screen; }

    .aurora span:nth-child(1) {
        width: 55vmax; height: 55vmax;
        background: radial-gradient(circle at 30% 30%, var(--bg-1), transparent 70%);
        top: -20%; left: -15%;
        animation: drift1 22s ease-in-out infinite alternate;
    }
    .aurora span:nth-child(2) {
        width: 50vmax; height: 50vmax;
        background: radial-gradient(circle at 60% 40%, var(--bg-2), transparent 70%);
        bottom: -25%; right: -10%;
        animation: drift2 26s ease-in-out infinite alternate;
    }
    .aurora span:nth-child(3) {
        width: 40vmax; height: 40vmax;
        background: radial-gradient(circle at 50% 50%, var(--bg-3), transparent 70%);
        top: 30%; left: 35%;
        animation: drift3 19s ease-in-out infinite alternate;
    }

    @keyframes drift1 { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(6%, 8%) scale(1.12); } }
    @keyframes drift2 { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(-8%, -6%) scale(1.15); } }
    @keyframes drift3 { 0% { transform: translate(-50%,-50%) scale(1); } 100% { transform: translate(-46%,-56%) scale(1.2); } }

    /* Лёгкое зерно для глубины */
    .grain {
        position: fixed;
        inset: 0;
        z-index: 5;
        pointer-events: none;
        opacity: 0.035;
        mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    }

    /* --- ШАПКА (плавающая стеклянная капсула) --- */
    header {
        display: flex;
        align-items: center;
        justify-content: center;
        width: calc(100% - 24px);
        max-width: 480px;
        margin: 12px auto 0;
        height: var(--header-height);
        border-radius: 20px;
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        box-shadow: var(--glass-shadow);
        backdrop-filter: blur(22px) saturate(160%);
        -webkit-backdrop-filter: blur(22px) saturate(160%);
        position: relative;
        flex-shrink: 0;
        z-index: 20;
        padding: 0 8px;
    }

    h1 {
        font-family: 'Unbounded', sans-serif;
        font-size: clamp(18px, 5vw, 22px);
        font-weight: 800;
        margin: 0;
        letter-spacing: 1.5px;
        background: linear-gradient(120deg, var(--accent), var(--accent-2));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 2px 10px rgba(139, 92, 246, 0.25));
    }

    .header-left {
        position: absolute;
        left: 8px;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .header-right {
        position: absolute;
        right: 8px;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .icon-btn {
        background: var(--key-bg);
        border: 1px solid var(--glass-border);
        cursor: pointer;
        color: var(--text-main);
        padding: 0;
        width: 38px;
        height: 38px;
        border-radius: 12px;
        transition: transform 0.25s cubic-bezier(.34,1.56,.64,1), box-shadow 0.25s, background-color 0.25s, color 0.25s;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .icon-btn svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .icon-btn:hover { box-shadow: 0 0 0 4px var(--btn-hover), 0 4px 14px rgba(0,0,0,0.12); transform: translateY(-2px); color: var(--accent); }
    .icon-btn:active { transform: scale(0.9); }

    .hint-btn {
        background: linear-gradient(145deg, rgba(255,194,75,0.28), rgba(255,194,75,0.08));
        color: #e08e00;
        border: 1px solid rgba(255, 194, 75, 0.5);
        padding: 0;
        width: 38px;
        height: 38px;
        border-radius: 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.25s, box-shadow 0.25s;
    }
    body.dark-mode .hint-btn { color: #ffcf5c; }
    .hint-btn svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .hint-btn:hover { box-shadow: 0 0 0 5px rgba(255,194,75,0.18), 0 4px 14px rgba(255,194,75,0.25); transform: translateY(-2px) scale(1.04); }
    .hint-btn:active { transform: scale(0.9); }

    .restart-btn:hover svg { transform: rotate(220deg); }
    .restart-btn svg { transition: transform 0.5s cubic-bezier(.34,1.56,.64,1); }

    /* --- МОДАЛЬНЫЕ ОКНА (стекло) --- */
    .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: var(--modal-overlay);
        z-index: 200;
        display: none;
        justify-content: center;
        align-items: center;
        backdrop-filter: blur(8px) saturate(140%);
        -webkit-backdrop-filter: blur(8px) saturate(140%);
    }
    .modal-overlay.open { display: flex; animation: overlayIn 0.25s ease; }
    @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }

    .modal {
        background-color: var(--modal-bg);
        backdrop-filter: blur(30px) saturate(170%);
        -webkit-backdrop-filter: blur(30px) saturate(170%);
        border: 1px solid var(--glass-border);
        border-radius: 18px;
        padding: 22px;
        width: 90%;
        max-width: 400px;
        max-height: 80vh;
        display: flex;
        flex-direction: column;
        box-shadow: var(--glass-shadow);
        position: relative;
        animation: modalIn 0.35s cubic-bezier(.2,.9,.3,1.2);
    }
    @keyframes modalIn { from { opacity: 0; transform: scale(0.9) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }

    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
        border-bottom: 1px solid var(--header-border);
        padding-bottom: 12px;
    }
    .modal-header h2 {
        margin: 0;
        font-size: 1.15rem;
        font-family: 'Unbounded', sans-serif;
        font-weight: 700;
        letter-spacing: 0.3px;
    }

    .close-modal {
        background: var(--key-bg);
        border: 1px solid var(--glass-border);
        width: 32px;
        height: 32px;
        border-radius: 10px;
        color: var(--text-main);
        cursor: pointer;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s, background-color 0.2s, color 0.2s;
    }
    .close-modal svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
    .close-modal:hover { transform: rotate(90deg); background: var(--btn-hover); color: var(--accent); }

    .modal-body {
        overflow-y: auto;
        flex-grow: 1;
    }
    .modal-body p { color: var(--text-dim); line-height: 1.5; }

    /* Список слов */
    #guessed-words-list {
        list-style: none;
        padding: 0;
        margin: 0;
    }
    #guessed-words-list li {
        padding: 10px 12px;
        margin-bottom: 6px;
        border-radius: 10px;
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        font-size: 1.05rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: transform 0.15s;
    }
    #guessed-words-list li:hover { transform: translateX(2px); }
    .word-count {
        font-weight: 800;
        font-family: 'Unbounded', sans-serif;
        font-size: 0.75rem;
        color: var(--accent-2);
    }

    /* Кнопки в модалке */
    .danger-btn {
        background: linear-gradient(135deg, #ff6b6b, #e0483f);
        color: white;
        border: none;
        padding: 12px 15px;
        border-radius: 10px;
        font-weight: 800;
        font-family: 'Manrope', sans-serif;
        cursor: pointer;
        width: 100%;
        margin-top: 10px;
        box-shadow: 0 6px 18px rgba(224, 72, 63, 0.35);
        transition: transform 0.15s, box-shadow 0.15s;
    }
    .danger-btn:hover { box-shadow: 0 8px 22px rgba(224, 72, 63, 0.5); transform: translateY(-1px); }
    .danger-btn:active { transform: scale(0.98); }

    .empty-msg { text-align: center; color: var(--text-dim); margin-top: 20px; }

    /* --- СООБЩЕНИЯ --- */
    #message-container {
        position: absolute;
        top: 12%;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 90%;
        align-items: center;
    }

    .message {
        background: var(--glass-bg-strong);
        backdrop-filter: blur(18px) saturate(160%);
        -webkit-backdrop-filter: blur(18px) saturate(160%);
        border: 1px solid var(--glass-border);
        color: var(--text-main);
        padding: 10px 22px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 14px;
        opacity: 0;
        transform: translateY(-8px);
        transition: opacity 0.3s, transform 0.3s;
        text-align: center;
        box-shadow: var(--glass-shadow);
    }
    .message.show { opacity: 1; transform: translateY(0); }

    /* --- ДОСКА --- */
    #board-container {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-grow: 1;
        width: 100%;
        overflow: hidden;
        padding: 10px;
    }

    #board {
        display: grid;
        grid-template-rows: repeat(6, 1fr);
        grid-gap: 6px;
        width: 100%;
        max-width: 350px;
        aspect-ratio: 5 / 6;
        max-height: calc(100dvh - var(--header-height) - 230px);
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 18px;
        box-shadow: var(--glass-shadow);
        backdrop-filter: blur(18px) saturate(150%);
        -webkit-backdrop-filter: blur(18px) saturate(150%);
        padding: 14px;
        transition: box-shadow 0.4s;
    }

    #board.win-pulse {
        animation: winPulse 0.9s ease-in-out 2;
    }
    @keyframes winPulse {
        0%, 100% { box-shadow: var(--glass-shadow); }
        50% { box-shadow: 0 0 0 6px rgba(63, 212, 139, 0.25), 0 10px 40px rgba(63, 212, 139, 0.35); }
    }

    .row {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        grid-gap: 6px;
    }

    .tile {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: clamp(1.5rem, 4vh, 2rem);
        font-weight: 800;
        font-family: 'Unbounded', sans-serif;
        text-transform: uppercase;
        background: rgba(255,255,255,0.02);
        border: 2px solid var(--tile-border);
        color: var(--tile-text-filled);
        border-radius: 8px;
        user-select: none;
        transition: background-color 0.2s, border-color 0.2s, box-shadow 0.3s, transform 0.15s;
    }

    .tile[data-state="filled"] {
        border-color: var(--tile-filled-border);
        background: var(--btn-hover);
        animation: pop 0.12s;
        box-shadow: 0 0 0 3px var(--btn-hover);
    }

    .tile[data-state="correct"] {
        background: linear-gradient(150deg, var(--tile-correct-a), var(--tile-correct-b)) !important;
        border-color: transparent !important;
        color: white !important;
        box-shadow: 0 4px 18px rgba(16, 185, 129, 0.5) !important;
    }
    .tile[data-state="present"] {
        background: linear-gradient(150deg, var(--tile-present-a), var(--tile-present-b)) !important;
        border-color: transparent !important;
        color: white !important;
        box-shadow: 0 4px 18px rgba(217, 147, 10, 0.45) !important;
    }
    .tile[data-state="absent"] {
        background: var(--tile-absent) !important;
        border-color: var(--tile-absent-border) !important;
        color: var(--text-dim) !important;
        box-shadow: none !important;
    }

    .tile.flip { animation: flip 0.6s ease forwards; }
    .row.shake { animation: shake 0.5s; }

    @keyframes pop { 50% { transform: scale(1.12); } }
    @keyframes flip {
        0% { transform: rotateX(0); }
        50% { transform: rotateX(90deg); }
        100% { transform: rotateX(0); }
    }
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        10%, 30%, 50%, 70%, 90% { transform: translateX(-4px); }
        20%, 40%, 60%, 80% { transform: translateX(4px); }
    }

    /* --- КЛАВИАТУРА --- */
    #keyboard {
        width: calc(100% - 12px);
        max-width: 500px;
        padding: 12px 8px;
        margin-bottom: 8px;
        flex-shrink: 0;
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 18px;
        box-shadow: var(--glass-shadow);
        backdrop-filter: blur(18px) saturate(150%);
        -webkit-backdrop-filter: blur(18px) saturate(150%);
    }

    .keyboard-row {
        display: flex;
        justify-content: center;
        margin-bottom: 6px;
        width: 100%;
        gap: 5px;
    }
    .keyboard-row:last-child { margin-bottom: 0; }

    .key {
        font-family: 'Manrope', sans-serif;
        font-weight: 700;
        border: 1px solid var(--glass-border);
        height: 52px;
        border-radius: 8px;
        cursor: pointer;
        background-color: var(--key-bg);
        color: var(--key-text);
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        text-transform: uppercase;
        font-size: 14px;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        transition: transform 0.1s, box-shadow 0.2s, background-color 0.25s, border-color 0.25s;
    }
    .key:hover { box-shadow: 0 0 0 3px var(--btn-hover); }
    .key:active { transform: scale(0.92); }
    .key svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .key.large { flex: 1.5; font-size: 11px; letter-spacing: 0.5px; }

    .key[data-state="correct"] { background: linear-gradient(150deg, var(--tile-correct-a), var(--tile-correct-b)); color: white; border-color: transparent; box-shadow: 0 3px 10px rgba(16,185,129,0.35); }
    .key[data-state="present"] { background: linear-gradient(150deg, var(--tile-present-a), var(--tile-present-b)); color: white; border-color: transparent; box-shadow: 0 3px 10px rgba(217,147,10,0.3); }
    .key[data-state="absent"] { background-color: var(--tile-absent); color: var(--text-dim); border-color: var(--tile-absent-border); box-shadow: none; }

    button { outline: none; font-family: inherit; }

    @media (max-width: 400px) {
        .keyboard-row { gap: 3px; margin-bottom: 5px; }
        #keyboard { padding: 10px 4px; }
        .key { height: 48px; font-size: 13px; }
    }
    @media (max-height: 600px) {
        :root { --header-height: 46px; }
        #board { max-height: calc(100dvh - 210px); padding: 8px; }
        .key { height: 40px; }
        #keyboard { padding: 8px 6px; }
    }

    .modal-actions {
        display: flex;
        gap: 10px;
        margin-top: 20px;
    }

    .secondary-btn {
        background: var(--key-bg);
        color: var(--text-main);
        border: 1px solid var(--glass-border);
        padding: 12px 15px;
        border-radius: 10px;
        font-weight: 800;
        cursor: pointer;
        width: 100%;
        font-family: 'Manrope', sans-serif;
        transition: box-shadow 0.2s, transform 0.15s;
    }
    .secondary-btn:hover { box-shadow: 0 0 0 3px var(--btn-hover); transform: translateY(-1px); }

    .modal-actions .danger-btn { margin-top: 0; }
</style>
</head>
<body>

    <div class="aurora"><span></span><span></span><span></span></div>
    <div class="grain"></div>

    <header>
        <div class="header-left">
            <button class="icon-btn" onclick="openStats()" title="Статистика">
                <svg viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M7 5H5a2 2 0 0 0 0 4h2"/><path d="M17 5h2a2 2 0 0 1 0 4h-2"/><path d="M12 14v3"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>
            </button>
            <button class="icon-btn" onclick="openSettings()" title="Настройки">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.7"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
            </button>
        </div>

        <h1>СЛОВОДЕЛ</h1>

        <div class="header-right">
            <button class="hint-btn" onclick="useHint()" title="Подсказка">
                <svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 21.5h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5.9 1.1.9 1.8v.5h6.2v-.5c0-.7.3-1.3.9-1.8A7 7 0 0 0 12 2Z"/></svg>
            </button>
            <button class="icon-btn restart-btn" onclick="startNewGame()" title="Новая игра">
                <svg viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 0 1 14.6-5.9L20 8"/><path d="M20 3.5V8h-4.5"/><path d="M20.5 12A8.5 8.5 0 0 1 5.9 17.9L4 16"/><path d="M4 20.5V16h4.5"/></svg>
            </button>
            <button class="icon-btn theme-btn" onclick="toggleTheme()" title="Сменить тему">
                <span id="theme-icon"></span>
            </button>
        </div>
    </header>

    <!-- Модальное окно Статистики -->
    <div id="stats-modal-overlay" class="modal-overlay" onclick="closeModal(event, 'stats-modal-overlay')">
        <div class="modal">
            <div class="modal-header">
                <h2>Угаданные слова</h2>
                <button class="close-modal" onclick="closeModal(null, 'stats-modal-overlay')">
                    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <ul id="guessed-words-list">
                    <!-- Список будет здесь -->
                </ul>
                <div id="empty-stats-msg" class="empty-msg">Вы пока не угадали ни одного слова.</div>
            </div>
        </div>
    </div>
	<!-- Модальное окно Подтверждения -->
    <div id="confirm-modal-overlay" class="modal-overlay" onclick="closeModal(event, 'confirm-modal-overlay')">
        <div class="modal" style="max-width: 350px;">
            <div class="modal-header">
                <h2>Подтверждение</h2>
                <button class="close-modal" onclick="closeModal(null, 'confirm-modal-overlay')">
                    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <p>Вы уверены, что хотите удалить всю историю побед? Это действие нельзя отменить.</p>

                <div class="modal-actions">
                    <button class="secondary-btn" onclick="closeModal(null, 'confirm-modal-overlay')">Отмена</button>
                    <button class="danger-btn" onclick="performClearStats()">Удалить</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно Настроек -->
    <div id="settings-modal-overlay" class="modal-overlay" onclick="closeModal(event, 'settings-modal-overlay')">
        <div class="modal">
            <div class="modal-header">
                <h2>Настройки</h2>
                <button class="close-modal" onclick="closeModal(null, 'settings-modal-overlay')">
                    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <p>Здесь можно сбросить прогресс игры.</p>
                <button class="danger-btn" onclick="askToClearStats()">Очистить статистику</button>
            </div>
        </div>
    </div>

    <div id="message-container"></div>

    <div id="board-container">
        <div id="board"></div>
    </div>

    <div id="keyboard"></div>

<script>
        // --- КОНСТАНТЫ И НАСТРОЙКИ ---
        const DATA_URL = 'slovodel_words.json';
        const WORD_LENGTH = 5;
        const KEYBOARD_LAYOUT = [
            "йцукенгшщзхъ",
            "фывапролджэё",
            "ячсмитьбю"
        ];

        // --- ИКОНКИ (SVG-строки для динамических элементов) ---
        const ICON_SUN = '<svg viewBox="0 0 24 24" style="stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;width:18px;height:18px;"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>';
        const ICON_MOON = '<svg viewBox="0 0 24 24" style="stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;width:18px;height:18px;"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>';
        const ICON_TROPHY = '<svg viewBox="0 0 24 24" style="stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;width:16px;height:16px;"><path d="M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M7 5H5a2 2 0 0 0 0 4h2"/><path d="M17 5h2a2 2 0 0 1 0 4h-2"/><path d="M12 14v3"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>';
        const ICON_BULB = '<svg viewBox="0 0 24 24" style="stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;width:16px;height:16px;"><path d="M9 18h6"/><path d="M10 21.5h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5.9 1.1.9 1.8v.5h6.2v-.5c0-.7.3-1.3.9-1.8A7 7 0 0 0 12 2Z"/></svg>';
        const ICON_BACKSPACE = '<svg viewBox="0 0 24 24" style="stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;width:18px;height:18px;"><path d="M21 7v10a1 1 0 0 1-1 1H8l-6-6 6-6h12a1 1 0 0 1 1 1Z"/><path d="M11 10l4 4m0-4-4 4"/></svg>';

        // --- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ---
        let allWordsSet = new Set();
        let secretWords = [];

        let targetWord = "";
        let guesses = [];
        let currentRow = 0;
        let isGameOver = false;
        let isAnimating = false;
        let isDataLoaded = false;

        // Флаг: использовалась ли подсказка в текущей партии
        let hasUsedHint = false;

        // Объект статистики
        let gameStats = {
            guessedWords: [] // Хранит объекты: { word: "СЛОВО", usedHint: boolean }
        };

        // --- DOM ЭЛЕМЕНТЫ ---
        const board = document.getElementById("board");
        const keyboard = document.getElementById("keyboard");
        const messageContainer = document.getElementById("message-container");

        // --- ИНИЦИАЛИЗАЦИЯ ---
        async function init() {
            initTheme();
            loadStats();

            try {
                const response = await fetch(DATA_URL);
                if (!response.ok) throw new Error("Не удалось загрузить словарь");

                const data = await response.json();

                data.forEach(item => {
                    if (item.word && item.word.length === WORD_LENGTH) {
                        allWordsSet.add(item.word);
                        if (item.secret) {
                            secretWords.push(item.word);
                        }
                    }
                });

                isDataLoaded = true;
                createBoard();
                createKeyboard();
                startNewGame(true);

            } catch (error) {
                console.error(error);
                board.innerHTML = "<div style='text-align:center; padding:20px;'>Ошибка загрузки словаря.</div>";
            }
        }

        // --- ТЕМА ОФОРМЛЕНИЯ ---
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.body.classList.add('dark-mode');
                document.getElementById('theme-icon').innerHTML = ICON_SUN;
            } else {
                document.getElementById('theme-icon').innerHTML = ICON_MOON;
            }
        }

        function toggleTheme() {
            const body = document.body;
            body.classList.toggle('dark-mode');
            const icon = document.getElementById('theme-icon');

            if (body.classList.contains('dark-mode')) {
                icon.innerHTML = ICON_SUN;
                localStorage.setItem('theme', 'dark');
            } else {
                icon.innerHTML = ICON_MOON;
                localStorage.setItem('theme', 'light');
            }
        }

        // --- СТАТИСТИКА ---
        function loadStats() {
            const savedStats = localStorage.getItem('slovodel_stats');
            if (savedStats) {
                try {
                    gameStats = JSON.parse(savedStats);
                    if (!gameStats.guessedWords) gameStats.guessedWords = [];
                } catch (e) {
                    console.error("Ошибка чтения статистики", e);
                    gameStats.guessedWords = [];
                }
            }
        }

        function saveWin(word) {
            const winData = {
                word: word,
                usedHint: hasUsedHint
            };
            gameStats.guessedWords.unshift(winData);
            localStorage.setItem('slovodel_stats', JSON.stringify(gameStats));
        }

        function askToClearStats() {
            document.getElementById('settings-modal-overlay').classList.remove('open');
            document.getElementById('confirm-modal-overlay').classList.add('open');
        }

        function performClearStats() {
            gameStats.guessedWords = [];
            localStorage.removeItem('slovodel_stats');
            showMessage("Статистика очищена");
            document.getElementById('confirm-modal-overlay').classList.remove('open');
        }

        // --- МОДАЛЬНЫЕ ОКНА ---
        function openStats() {
            const list = document.getElementById('guessed-words-list');
            const emptyMsg = document.getElementById('empty-stats-msg');
            list.innerHTML = '';

            if (gameStats.guessedWords.length === 0) {
                emptyMsg.style.display = 'block';
            } else {
                emptyMsg.style.display = 'none';

                gameStats.guessedWords.forEach((item, index) => {
                    const li = document.createElement('li');
                    const count = gameStats.guessedWords.length - index;

                    // Логика иконки: Лампочка если была подсказка, Кубок если честно
                    const iconDisplay = item.usedHint ? ICON_BULB : ICON_TROPHY;
                    const titleText = item.usedHint ? "С подсказкой" : "Честная победа";

                    li.innerHTML = `
                        <span>${item.word}</span>
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <span class="word-count">#${count}</span>
                            <span style="display:flex; opacity:.8;" title="${titleText}">${iconDisplay}</span>
                        </div>
                    `;
                    list.appendChild(li);
                });
            }
            document.getElementById('stats-modal-overlay').classList.add('open');
        }

        function openSettings() {
            document.getElementById('settings-modal-overlay').classList.add('open');
        }

        function closeModal(event, id) {
            if (!event || event.target.id === id) {
                document.getElementById(id).classList.remove('open');
            }
        }

        // --- ИГРОВОЙ ПРОЦЕСС ---
        function startNewGame(isFirstLoad = false) {
            if (!isDataLoaded) return;

            hasUsedHint = false; // Сброс флага подсказки
            currentRow = 0;
            guesses = [[], [], [], [], [], []];
            isGameOver = false;
            isAnimating = false;

            if (secretWords.length > 0) {
                targetWord = secretWords[Math.floor(Math.random() * secretWords.length)];
                console.log("Загадано:", targetWord);
            } else {
                alert("Ошибка: нет секретных слов!");
            }

            // Очистка UI
            document.querySelectorAll(".tile").forEach(tile => {
                tile.textContent = "";
                tile.className = "tile";
                tile.removeAttribute("data-state");
            });

            document.querySelectorAll(".key").forEach(key => {
                key.removeAttribute("data-state");
            });

            board.classList.remove("win-pulse");
            messageContainer.innerHTML = "";
        }

        function createBoard() {
            board.innerHTML = "";
            for (let i = 0; i < 6; i++) {
                const row = document.createElement("div");
                row.className = "row";
                for (let j = 0; j < 5; j++) {
                    const tile = document.createElement("div");
                    tile.className = "tile";
                    row.appendChild(tile);
                }
                board.appendChild(row);
            }
        }

        function createKeyboard() {
            keyboard.innerHTML = '';
            KEYBOARD_LAYOUT.forEach((rowString, index) => {
                const rowDiv = document.createElement("div");
                rowDiv.className = "keyboard-row";

                if (index === 2) {
                    const enterKey = createKey("Enter", "large");
                    enterKey.textContent = "ВВОД";
                    enterKey.onclick = submitGuess;
                    rowDiv.appendChild(enterKey);
                }

                rowString.split("").forEach(char => {
                    const key = createKey(char);
                    key.onclick = () => handlePress(char);
                    rowDiv.appendChild(key);
                });

                if (index === 2) {
                    const backKey = createKey("Backspace", "large");
                    backKey.innerHTML = ICON_BACKSPACE;
                    backKey.onclick = deleteLetter;
                    rowDiv.appendChild(backKey);
                }
                keyboard.appendChild(rowDiv);
            });
        }

        function createKey(char, extraClass = "") {
            const button = document.createElement("button");
            button.textContent = char;
            button.className = `key ${extraClass}`;
            button.setAttribute("data-key", char);
            return button;
        }

        // --- ОБРАБОТКА ВВОДА ---
        function handlePress(key) {
            if (isGameOver || isAnimating || !isDataLoaded) return;
            if (document.querySelector('.modal-overlay.open')) return;

            const currentGuess = guesses[currentRow];

            if (currentGuess.length < WORD_LENGTH) {
                currentGuess.push(key);
                updateGrid();
                if (currentGuess.length === WORD_LENGTH) {
                    setTimeout(submitGuess, 100);
                }
            }
        }

        function deleteLetter() {
            if (isGameOver || isAnimating) return;
            if (document.querySelector('.modal-overlay.open')) return;

            const currentGuess = guesses[currentRow];
            currentGuess.pop();
            updateGrid();
        }

        function useHint() {
            if (isGameOver || isAnimating || !isDataLoaded) return;
            if (document.querySelector('.modal-overlay.open')) return;

            hasUsedHint = true; // Фиксируем использование

            const currentGuessArr = guesses[currentRow];
            let hintIndex = -1;

            for (let i = 0; i < WORD_LENGTH; i++) {
                if (!currentGuessArr[i] || currentGuessArr[i] !== targetWord[i]) {
                    hintIndex = i;
                    break;
                }
            }

            if (hintIndex !== -1) {
                currentGuessArr[hintIndex] = targetWord[hintIndex];
                guesses[currentRow] = currentGuessArr.slice(0, hintIndex + 1);
                updateGrid();
                if (guesses[currentRow].length === WORD_LENGTH) {
                    setTimeout(submitGuess, 100);
                }
            }
        }

        function submitGuess() {
            if (isGameOver || isAnimating) return;
            if (document.querySelector('.modal-overlay.open')) return;

            const currentGuessArr = guesses[currentRow];
            const currentWord = currentGuessArr.join("");

            if (currentGuessArr.length !== WORD_LENGTH) {
                showMessage("Мало букв");
                shakeRow();
                return;
            }

            if (!allWordsSet.has(currentWord)) {
                showMessage("Такого слова нет");
                shakeRow();
                return;
            }

            flipTiles(currentWord);
        }

        function updateGrid() {
            const row = board.children[currentRow];
            const currentGuess = guesses[currentRow];
            for (let i = 0; i < WORD_LENGTH; i++) {
                const tile = row.children[i];
                const letter = currentGuess[i];
                tile.textContent = letter || "";
                tile.removeAttribute("data-state");
                if (letter) {
                    tile.setAttribute("data-state", "filled");
                }
            }
        }

        function shakeRow() {
            const row = board.children[currentRow];
            row.classList.remove("shake");
            void row.offsetWidth;
            row.classList.add("shake");
        }

        // --- АНИМАЦИЯ И ПРОВЕРКА ---
        function flipTiles(guess) {
            isAnimating = true;
            const row = board.children[currentRow];
            const targetLetters = targetWord.split("");
            const guessLetters = guess.split("");
            const states = Array(5).fill("absent");

            // 1. Поиск точных совпадений (зеленые)
            guessLetters.forEach((letter, i) => {
                if (targetLetters[i] === letter) {
                    states[i] = "correct";
                    targetLetters[i] = null;
                }
            });

            // 2. Поиск частичных совпадений (желтые)
            guessLetters.forEach((letter, i) => {
                if (states[i] === "correct") return;
                const indexInTarget = targetLetters.indexOf(letter);
                if (indexInTarget !== -1) {
                    states[i] = "present";
                    targetLetters[indexInTarget] = null;
                }
            });

            // 3. Анимация переворота
            guessLetters.forEach((letter, i) => {
                const tile = row.children[i];
                setTimeout(() => {
                    tile.classList.add("flip");
                    tile.setAttribute("data-state", states[i]);
                    updateKeyboardColor(letter, states[i]);
                }, i * 250);
            });

            // 4. Завершение хода
            setTimeout(() => {
                isAnimating = false;
                if (guess === targetWord) {
                    showMessage("Победа! 🏆", 2500);
                    isGameOver = true;
                    board.classList.add("win-pulse");
                    saveWin(targetWord);
                    setTimeout(startNewGame, 3000);
                } else if (currentRow === 5) {
                    showMessage(`Вы проиграли. Слово: ${targetWord.toUpperCase()}`, -1);
                    isGameOver = true;
                } else {
                    currentRow++;
                }
            }, WORD_LENGTH * 250 + 100);
        }

        function updateKeyboardColor(letter, state) {
            const key = document.querySelector(`.key[data-key="${letter}"]`);
            if (!key) return;
            const currentState = key.getAttribute("data-state");

            if (state === "correct") {
                key.setAttribute("data-state", "correct");
            } else if (state === "present" && currentState !== "correct") {
                key.setAttribute("data-state", "present");
            } else if (state === "absent" && currentState !== "correct" && currentState !== "present") {
                key.setAttribute("data-state", "absent");
            }
        }

        function showMessage(text, duration = 2000) {
            const msg = document.createElement("div");
            msg.textContent = text;
            msg.className = "message show";
            messageContainer.prepend(msg);
            if (duration > 0) {
                setTimeout(() => {
                    msg.classList.remove("show");
                    setTimeout(() => msg.remove(), 300);
                }, duration);
            }
        }

        // --- СЛУШАТЕЛИ СОБЫТИЙ ---
        document.addEventListener("keydown", (e) => {
            if (isGameOver || isAnimating || !isDataLoaded) return;

            // Закрытие модалок по Esc
            if (document.querySelector('.modal-overlay.open')) {
                if (e.key === "Escape") {
                    document.querySelectorAll('.modal-overlay').forEach(el => el.classList.remove('open'));
                }
                return;
            }

            const key = e.key.toLowerCase();
            if (key === "enter") { submitGuess(); return; }
            if (key === "backspace") { deleteLetter(); return; }
            if (/^[а-яё]$/.test(key)) { handlePress(key); }
        });

        // Запуск
        init();
    </script>
</body>
</html>
